name: slack-activator

on:
  push:
    branches:
      - master
    paths:
      - "packages/slack-activator/**"
      - ".github/workflows/slack-activator.yml"
  pull_request:
    paths:
      - "packages/slack-activator/**"
      - ".github/workflows/slack-activator.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/slack-activator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: yarn
          cache-dependency-path: packages/slack-activator/yarn.lock
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
